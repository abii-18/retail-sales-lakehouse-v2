services:

  # Source PostgreSQL (Retail Application)

  postgres:
    image: postgres:16
    container_name: retail-postgres
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass
      POSTGRES_DB: retail_lakehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # Airflow Metadata Database

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data


  # Airflow Initialization

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      RAW_BUCKET_NAME: retail-sales-lakehouse-abinav

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_STAGE: ${SNOWFLAKE_STAGE}

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin
      "
    user: "50000:0"


  # Airflow Scheduler

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      RAW_BUCKET_NAME: retail-sales-lakehouse-abinav

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_STAGE: ${SNOWFLAKE_STAGE}

    command: scheduler

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../staging:/opt/airflow/staging
      - C:\Users\AbinaV\.aws:/home/airflow/.aws:ro
      - ../snowflake:/opt/airflow/snowflake
      - ../dbt:/opt/airflow/dbt
      - C:\Users\AbinaV\.dbt:/home/airflow/.dbt
      - ../scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock


  # Airflow Webserver

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-webserver
    restart: always
    depends_on:
      - airflow-scheduler
    ports:
      - "8080:8080"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

      RAW_BUCKET_NAME: retail-sales-lakehouse-abinav

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      SNOWFLAKE_STAGE: ${SNOWFLAKE_STAGE}

    command: webserver

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../staging:/opt/airflow/staging
      - C:\Users\AbinaV\.aws:/home/airflow/.aws:ro
      - ../snowflake:/opt/airflow/snowflake
      - ../dbt:/opt/airflow/dbt
      - C:\Users\AbinaV\.dbt:/home/airflow/.dbt
      - ../scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock

  dbt:
    image: retail-dbt
    container_name: retail-dbt
    working_dir: /usr/app/retail_sales_lakehouse

    volumes:
      - ../dbt:/usr/app
      - C:\Users\AbinaV\.dbt:/root/.dbt

    stdin_open: true
    tty: true


volumes:
  postgres_data:
  airflow_postgres_data: